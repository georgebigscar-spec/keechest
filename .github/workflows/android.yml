name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 16 KiB pages, required on new Android 15+ devices.
  RUSTFLAGS: -D warnings -C link-arg=-Wl,-z,max-page-size=16384

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build the native library
        run: >
          cargo ndk -t arm64-v8a -t x86_64 --platform 26
          -o android/app/src/main/jniLibs
          build --release -p keechest-android

      # Optional: sign with your own key so that updates install over the
      # previous version. Without these secrets the APK is signed with the
      # runner's throwaway debug key.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEECHEST_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEECHEST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          KEECHEST_KEYSTORE_PASSWORD: ${{ secrets.KEECHEST_KEYSTORE_PASSWORD }}
          KEECHEST_KEY_ALIAS: ${{ secrets.KEECHEST_KEY_ALIAS }}
          KEECHEST_KEY_PASSWORD: ${{ secrets.KEECHEST_KEY_PASSWORD }}
        run: gradle -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: keechest-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
