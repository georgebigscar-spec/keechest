name: Build

# Ready-to-run builds for Linux, Windows and Android, uploaded as workflow
# artifacts. A tag like v0.2.0 also publishes them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p keechest
      - name: Package
        run: |
          dir=keechest-linux-x86_64
          mkdir "$dir"
          cp target/release/keechest README.md LICENSE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v5
        with:
          name: keechest-linux-x86_64
          path: keechest-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p keechest
      - name: Package
        shell: pwsh
        run: |
          $dir = "keechest-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/keechest.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: keechest-windows-x86_64
          path: keechest-windows-x86_64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # 16 KiB pages, required on new Android 15+ devices.
      RUSTFLAGS: -D warnings -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build the native library
        run: >
          cargo ndk -t arm64-v8a -t x86_64 --platform 26
          -o android/app/src/main/jniLibs
          build --release -p keechest-android

      # Optional: sign with your own key so that updates install over the
      # previous version. Without these secrets the APK is signed with the
      # runner's throwaway debug key.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEECHEST_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEECHEST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          KEECHEST_KEYSTORE_PASSWORD: ${{ secrets.KEECHEST_KEYSTORE_PASSWORD }}
          KEECHEST_KEY_ALIAS: ${{ secrets.KEECHEST_KEY_ALIAS }}
          KEECHEST_KEY_PASSWORD: ${{ secrets.KEECHEST_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk keechest-android.apk

      - uses: actions/upload-artifact@v5
        with:
          name: keechest-android
          path: keechest-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "KeeChest $GITHUB_REF_NAME" --generate-notes
