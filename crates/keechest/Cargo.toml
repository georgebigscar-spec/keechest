[package]
name = "keechest"
description = "A local password manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keechest-core.workspace = true
fluent_egui.workspace = true
egui.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["default"] }
rfd = "0.15"
arboard = "3"
directories = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# OpenGL ES is everywhere and keeps the library small. AccessKit needs
# GameActivity, and the clipboard goes through MainActivity.
eframe = { workspace = true, features = [
    "android-native-activity",
    "default_fonts",
    "glow",
    "links",
] }
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"
log = "0.4"
